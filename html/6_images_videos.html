<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images and videos in html</title>
</head>

<body>
    <h1>Media Gallary</h1>
    <h2>Images</h2>
    <table width="100%" cellpadding="20">
        <tr>
            <td width="33.33%" align="center">
                <img width="400px" src="images/1.jpeg" alt="image not found">

            </td>
            <td width="33.33%" align="center">
                <img width="400px" src="images/2.jpeg" alt="image not found">

            </td>
            <td width="33.33%" align="center">
                <img height="400px" width="400px" src="images/3.jpeg" alt="image not found">

            </td>


        </tr>
        <tr>
            <td align="center">
                <img width="400px" src="images/4.jpeg" alt="image not found">

            </td>
            <td align="center">
                <img width="400px" src="images/5.jpeg" alt="image not found">

            </td>
            <td align="center">
                <img height="400px" width="400px" src="images/6.jpeg" alt="image not found">

            </td>
        </tr>
        <tr>
            <td align="center">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/FyXVmQ0JBb8?si=c1e_ML8fImG1oEr-"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>
            <td align="center">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/V8M8_BIQCrs?si=pTXMW7Cp_0uIS0QZ"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>
            <td align="center">
             
            </td>
        </tr>
    </table>
</body>

</html>
