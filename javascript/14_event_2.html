<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .activeInput
        {
            background-color: antiquewhite;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>form related event</h1>
    <form action="">
        <table border="1" align="center" width="80%">
            <tr>
                <td>Email Address</td>
                <td>
                    <input type="email" id="email" placeholder="Email address" 
                    required oninput="updateCount(this.id)" onfocus="changeClass(this.id)" />
                    <span id="email_count"></span>
                </td>
                <td width="30%"></td>
            </tr>
            <tr>
                <td>Mobile </td>
                <td>
                    <input type="number" id="mobile" placeholder="mobile no" 
                    oninput="updateCount(this.id)" required onfocus="changeClass(this.id)" />
                    <span id="mobile_count"></span>
                </td>
                <td></td>
            </tr>
            <tr>
                <td>city</td>
                <td>
                    <input type="text" id="city" placeholder="City" 
                    oninput="updateCount(this.id)" required onfocus="changeClass(this.id)" />
                    <span id="city_count"></span>
                </td>
                <td></td>
            </tr>

        </table>
    </form>

    <script>
        //create function 
        let updateCount = function(tagID){
            // console.log(document.getElementById(tagID).value);
            let count = document.getElementById(tagID).value.length;
            console.log(count);
            let labelID = tagID + "_count";
            document.getElementById(labelID).innerHTML = "no of letters " + count;
        }
        //arrow 
        changeClass = (tagID) => {
            //console.log(tagID);
            document.getElementById(tagID).className = 'activeInput';
        }
    </script>
</body>

</html>
