<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="success.html" method="post" enctype="multipart/form-data">
        <table width='50%' cellpadding="10" align="center" border="1">
            <tr>
                <td align="center">
                    <font size="+4">Compose Email</font>
                </td>
            </tr>
            <tr>
                <td>
                    <input 
                    type="email" 
                    name="email" id="email" required 
                    placeholder="Email Address" />
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="subject" id="subject" required placeholder="subject" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="attachement">Select File</label>
                    <input type="file" name="attachement" id="attachement" multiple />
                </td>
            </tr>
            <tr>
                <td> <textarea name="message" id="message" cols="100" rows="10" required>

                </textarea></td>
            </tr>
            <tr>
                <td>
                    include 
                    <label for="address">
                        <input type="checkbox" name="address" id="address" value="1" /> Office Address
                    </label>
                    <label for="Mobile">
                        <input type="checkbox" name="Mobile" id="Mobile" value="2" /> Mobile No
                    </label>
                    
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" name="submit" value="Send email" />
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
