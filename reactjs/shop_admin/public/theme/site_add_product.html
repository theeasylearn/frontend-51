<!DOCTYPE html>
<html lang="en">
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Responsive Admin &amp; Dashboard Template based on Bootstrap 5">
	<meta name="author" content="AdminKit">
	<meta name="keywords"
		content="adminkit, bootstrap, bootstrap 5, admin, dashboard, template, responsive, css, sass, html, theme, front-end, ui kit, web">

	<link rel="preconnect" href="https://fonts.gstatic.com/">
	<link rel="shortcut icon" href="img/icons/icon-48x48.png" />
	<link rel="canonical" href="pages-blank-2.html" />
	<title>Add Product</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;display=swap" rel="stylesheet">
	<link class="js-stylesheet" href="css/light.css" rel="stylesheet">
</head>

<body data-theme="default" data-layout="fluid" data-sidebar-position="left" data-sidebar-layout="default">
	<div class="wrapper">
		<nav id="sidebar" class="sidebar js-sidebar">
			<div class="sidebar-content js-simplebar">
				<a class='sidebar-brand' href='index.html'>
					<span class="sidebar-brand-text align-middle">
						Administrator
					</span>
				</a>
				<ul class="sidebar-nav">
					<li class="sidebar-header">
						Modules
					</li>
					<li class="sidebar-item">
						<a class="sidebar-link">
							<span class="align-middle text-white">Dashboards</span>
						</a>
					</li>
				</ul>
			</div>
		</nav>
		<div class="main">
			<nav class="navbar navbar-expand navbar-light navbar-bg">
				<a class="sidebar-toggle js-sidebar-toggle">
					<i class="hamburger align-self-center"></i>
				</a>
			</nav>

			<main class="content">
				<div class="container-fluid p-0">
					<h1 class="h3 mb-3"></h1>

					<div class="row">
						<div class="col-12">
							<div class="card">
								<div class="card-header">
									<h4 class="card-title mb-0 text-dark">
										<span class="text-bg-primary p-1">Add product</span> - Product management
									</h4>
								</div>
								<div class="card-body">
									<form method="post">
										<div class="row g-3">
											<div class="col-md-4 col-sm-6 col-12">
												<label for="category_id" class="form-label">Category ID</label>
												<input type="number" class="form-control" id="category_id" name="category_id" required />
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label for="title" class="form-label">Title</label>
												<input type="text" class="form-control" id="title" name="title" required />
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label for="price" class="form-label">Price</label>
												<input type="number" step="0.01" class="form-control" id="price" name="price" required />
											</div>

											<div class="col-md-4 col-sm-6 col-12">
												<label for="stock" class="form-label">Stock</label>
												<input type="number" class="form-control" id="stock" name="stock" required />
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label for="weight" class="form-label">Weight</label>
												<input type="number" step="0.01" class="form-control" id="weight" name="weight" required />
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label for="size" class="form-label">Size</label>
												<input type="text" class="form-control" id="size" name="size" required />
											</div>

											<div class="col-md-4 col-sm-6 col-12">
												<label for="photo" class="form-label">Photo</label>
												<input type="file" class="form-control" id="photo" name="photo" required />
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label for="detail" class="form-label">Detail</label>
												<textarea class="form-control" id="detail" name="detail" rows="4" required></textarea>
											</div>
											<div class="col-md-4 col-sm-6 col-12">
												<label class="form-label">Is Live?</label>
												<div class="form-check">
													<input class="form-check-input" type="radio" name="is_live" id="yes" value="1" required>
													<label class="form-check-label" for="yes">Yes</label>
												</div>
												<div class="form-check">
													<input class="form-check-input" type="radio" name="is_live" id="no" value="0" required>
													<label class="form-check-label" for="no">No</label>
												</div>
											</div>
										</div>
										<div class="mt-4">
											<button type="submit" class="btn btn-primary">Save Product</button>
											<button type="reset" class="btn btn-secondary">Clear all</button>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</main>

			<footer class="footer">
				<div class="container-fluid">
					<div class="row text-muted">
						<div class="col-12">
							<p class="text-center">Developed @ the easylearn academy</p>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</div>

	<script src="js/app.js"></script>
</body>
</html>
