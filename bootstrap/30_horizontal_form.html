<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CDN (content delivery network) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- search bus 
        Source, Destination, Journey Date, Bus type, Preffered Time (morning, afternoon, evening) Search 
    -->
    <div class="container">
        <div class="row mt-5">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header text-bg-primary">
                        <h3>Search Bus</h3>
                    </div>
                    <div class="card-body">
                        <form action="">
                            <div class="row mb-3">
                                <label for="" class="col-form-label col-sm-3">Source</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" required placeholder="" />
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="" class="col-form-label col-sm-3">Destination</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" required placeholder="" />
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="" class="col-form-label col-sm-3">Journey Date</label>
                                <div class="col-sm-9">
                                    <input type="date" class="form-control" required placeholder="" />
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="" class="col-form-label col-sm-3">Bus type</label>
                                <div class="col-sm-9">
                                    <div class="form-check-inline">
                                        <input type="radio" class="form-check-input" value="1" required name="bustype"
                                            id="express" />
                                        <label for="" class="form-check-label">Express</label>
                                    </div>
                                    <div class="form-check-inline">
                                        <input type="radio" class="form-check-input" value="2" required name="bustype"
                                            id="ac" />
                                        <label for="" class="form-check-label">AC</label>
                                    </div>
                                    <div class="form-check-inline">
                                        <input type="radio" class="form-check-input" value="3" required name="bustype"
                                            id="sleeper" />
                                        <label for="" class="form-check-label">Sleeper</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="" class="col-form-label col-sm-3">
                                    Suitable Time for Journey
                                </label>
                                <div class="col-sm-9">
                                    <div class="form-check">
                                        <input type="checkbox" name="morning" value="1" />
                                        <label for="" class="form-check-label">Morning</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="checkbox" name="morning" value="2" />
                                        <label for="" class="form-check-label">After noon</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="checkbox" name="morning" value="4" />
                                        <label for="" class="form-check-label">Evening</label>
                                    </div>
                                     <div class="form-check">
                                         <input type="checkbox" name="morning" value="8" />
                                        <label for="" class="form-check-label">Night</label>
                                   </div>
                                </div>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary btn-lg">Search Bus</button>
                                <button type="reset" class="btn btn-dark btn-lg">Clear all</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
