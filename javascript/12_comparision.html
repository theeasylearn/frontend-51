<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>comparison operator in javascript</h1>
    <hr/>
    <b>use console to check output</b> 
    <script>
        console.log("'01' == 1",'01'==1);
        console.log("'01' === 1",'01'===1);
        console.log("undefine == null",undefined==null);
        console.log("undefine === null",undefined===null);
        console.log("true == 1",true==1);
        console.log("true === 1",true===1);
        console.log("true == undefined",true==undefined);
        console.log("true === undefined",true===undefined);

        console.log("'01' != 1",'01'!=1);
        console.log("'01' !== 1",'01'!==1);
        console.log("true !== 1",true!==1);
    </script>
</body>
</html>
