<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- login form -->
    <form method="get" action="success.html">
        <table border="1" 
        cellpadding="10" align= "center" cellpadding="5" width="50%" >
            <tr>
                <td colspan="2" align="center">
                    <h1>Login</h1>
                </td>
            </tr>
            <tr>
                <td>Email </td>
                <td>
                    <input type="email" name="email" id="email" required />
                </td>
            </tr>
            <tr>
                <td>
                    Password
                </td>
                <td>
                    <input type="password" name="password" id="password" required />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" 
                    value="login">
                    <input type="reset" 
                    value="clear all">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
