<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="get" action="success.html" novalidate autocomplete="on">
        <table border="1" cellpadding="10" align="center" cellpadding="5" width="50%">
            <tr>
                <td colspan="2" align="center">
                    <h1>form related attributes examples</h1>
                </td>
            </tr>
            <tr>
                <td>Email </td>
                <td>
                    <input type="email" name="email" id="email" required autofocus />
                </td>
            </tr>
            <tr>
                <td>
                    Password
                </td>
                <td>
                    <input type="password" name="password" id="password" required />
                </td>
            </tr>
            <tr>
                <td>OTP</td>
                <td>
                    <input type="number" name="otp" id="otp" required autocomplete="off" />
                </td>
            </tr>
            <tr>
                <td>Birth Date</td>
                <td>
                    <input type="date" name="dob" min="2000-01-01" max="31-01-2026" >
                </td>
            </tr>
            <tr>
                <td>Select Photo</td>
           
                <td>
                    <input type="file" name="photo" accept="image/*" />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="teacher login" formaction="success_2.html">
                    <input type="submit" value="student login">
                    <input type="reset" value="clear all">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
