<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>prompt & document.write method</h1>
    <hr/>

    <script>
        var message = "Enter number"
        var defaultValue = 1;
        var num1 = prompt(message,defaultValue);

        var num2 = prompt("Enter another number",1);
        alert("you have entered two number 1st num = " + num1 + " 2nd num = " + num2);
        //input we accept from user either in html or in javascript is always string
        //before we do mathematical operation, we should convert it into numbers 
        //conversion
        num1 = parseInt(num1);
        num2 = parseInt(num2);
        //do addition
        var addition = num1 + num2;
        alert("addition " + addition);
        //add new output at the end of page
        document.write("subtraction = ",num1-num2);
        document.write("<br/>multiplication = ",num1*num2);
        document.write("<br/> division = ",num1/num2);
        
    </script>
</body>
</html>
