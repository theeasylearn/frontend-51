<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>

<body>
    <h1>table in html</h1>
    <table border="1" width="70%" align="center" cellpadding="5" cellspacing="5">

        <thead >
            <tr>
                <td colspan="5" align="center">
                    <h2>Result sheet</h2>
                </td>
            </tr>
            <tr bgcolor="cyan">
                <th width="20px">Sr no</th>
                <th width="50%">Name</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>Bootstrap</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td bgcolor="yellow" align="center">
                    <b>Utsav</b>
                </td>
                <td>82</td>
                <td>78</td>
                <td>80</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Radhika</td>
                <td>88</td>
                <td>85</td>
                <td>87</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Shubham</td>
                <td>75</td>
                <td>72</td>
                <td>74</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Aman</td>
                <td>80</td>
                <td>77</td>
                <td>79</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">
                    <b>total</b>
                </td>
                <td>200</td>
                <td>300</td>
                <td>400</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
