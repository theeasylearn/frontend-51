    <script>
        var buttons = document.getElementsByTagName("input"); //return array
        console.log(buttons);
        var isZero = false;
        for (var index = 0; index < 9; index++) {
            buttons[index].onclick = function () {
                if (isZero == false) {
                    this.value = 'X';
                    isZero = true;
                }
                else 
                {
                    this.value = '0';
                    isZero = false;

                this.onclick = null;
            }
