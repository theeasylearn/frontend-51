<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>for each loop</h1>
    <script>
        const obj1 = {
            name: "Ankit",
            age: 25,
            city: "Bhavnagar",
            weight: 85.25,
        };

        for (let property in obj1) {
            console.log(property, obj1[property]); //name, age, city, weight
        }
    </script>
</body>

</html>
