<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Creating empty object & adding properties into it</h1>
    <script>
        //create empty object
        var user = {};
        console.log("empty object",user);

        //adding key value pair
        user.name = "ankit";
        user.surname = "patel";
        user['age'] = 21;
        user['gender'] = true;
        console.log("now object has ",user);

        
    </script>
</body>
</html>
