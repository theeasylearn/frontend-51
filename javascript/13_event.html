<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: aliceblue;
            text-align: center;
        }

        section {
            border: 1px solid black;
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>

<body>
    <section>
        <div id="one" onmouseover="changestyle(this.id);" onmouseout="removeStyle(this.id)">1</div>
        <div id="two" onmouseover="changestyle(this.id);" onmouseout="removeStyle(this.id)">2</div>
        <div id="three" onmouseover="changestyle(this.id);" onmouseout="removeStyle(this.id)">3</div>
    </section>

    <script>
        function changestyle(tagID) {
            document.getElementById(tagID).style = "background-color:blue;color:white";
        }
        function removeStyle(tagID) {
            //alert(tagID); 
            document.getElementById(tagID).style = "background-color:aliceblue;color:black";
        }
    </script>
</body>

</html>
