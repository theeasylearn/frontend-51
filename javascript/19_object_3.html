<!DOCTYPE html>
<html>

<head>
    <title>Product Form</title>
</head>

<body>

    <form onsubmit="return AddProduct();">
        <table border="1" cellpadding="10" align="center">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="name" required>
                    </td>
                    <td>
                        <input type="number" id="price" required>
                    </td>
                    <td>
                        <input type="number" id="quantity" required>
                    </td>
                    <td>
                        <input type="number" id="total" value="100" readonly>
                    </td>
                    <td>
                        <input type="submit" value="Add to bill" />
                    </td>
                </tr>
            </thead>
            <tbody id="bill">

            </tbody>
        </table>
        <br>

    </form>
    <script>
        function Product(name, price, quantity, total) {
            //property variable
            this.name = name,
                this.price = price,
                this.quantity = quantity,
                this.total = total,
                this.add = function () {
                    console.log(this.name, this.price, this.quantity);
                    document.getElementById('bill').innerHTML += `<tr>
                        <td>${this.name}</td>
                        <td>${this.price}</td>
                        <td>${this.quantity}</td>
                        <td>${this.total}</td>
                        <td><button type='button'>Delete Item</button></td>
                        </tr>`;
                }
        }

        function AddProduct() {
            //create object
            let name = document.getElementById('name').value;
            let price = document.getElementById('price').value;
            let quantity = document.getElementById('quantity').value;
            let total = document.getElementById('total').value;

            let p1 = new Product(name, price, quantity, total);
            p1.add();
            return false;
        }
    </script>
</body>

</html>
